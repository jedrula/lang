id: a2-01-past-simple
level: A2
title: "Past Simple: what happened"
titlePl: "Past Simple: co się wydarzyło"
intro: "The **Past Simple** describes finished actions in the past: *I worked, she went*. Regular verbs add **-ed**; irregular verbs have their own forms you must learn (go → went, see → saw). Questions and negatives use **did / didn't** + the base form: *Did you go? I didn't go.*"
introPl: "**Past Simple** opisuje zakończone czynności w przeszłości, często z określeniem czasu (*yesterday, last week, two days ago*). Polski rozróżnia aspekt (*czytałem / przeczytałem*), a angielski nie: *I read the book* może znaczyć „czytałem” albo „przeczytałem” – ważne jest to, że sprawa jest zamknięta. Czasowniki regularne dostają **-ed**, form nieregularnych trzeba się nauczyć (go → went). W pytaniach i przeczeniach używamy **did / didn't** + forma podstawowa: *Did you go?*, *I didn't go* (nie *didn't went*)."
items:
  - id: a2-01-went
    kind: word
    en: went
    pl: poszedłem
    plAlt: [ pojechałem, poszłam, pojechałam, poszedł, pojechał, poszła, pojechała ]
    example:
      en: We went to the beach last summer.
      pl: Zeszłego lata pojechaliśmy na plażę.
    note: "Irregular: go → went → gone."
    notePl: "Czasownik nieregularny: go → went → gone. *Went* to zarówno „szedłem”, jak i „pojechałem”."
  - id: a2-01-saw
    kind: word
    en: saw
    pl: widziałem
    plAlt: [ zobaczyłem, widziałam, zobaczyłam, widział, zobaczył ]
    example:
      en: I saw your brother yesterday.
      pl: Wczoraj widziałem twojego brata.
    note: "Irregular: see → saw → seen."
  - id: a2-01-had
    kind: word
    en: had
    pl: miałem
    plAlt: [ miałam, miał, miała, mieliśmy ]
    example:
      en: We had a great time at the party.
      pl: Świetnie się bawiliśmy na imprezie.
    note: "Irregular: have → had → had."
  - id: a2-01-bought
    kind: word
    en: bought
    pl: kupiłem
    plAlt: [ kupiłam, kupił, kupiła ]
    example:
      en: She bought a new phone last week.
      pl: W zeszłym tygodniu kupiła nowy telefon.
    note: buy → bought. Don't confuse with brought (bring → brought).
    notePl: buy → bought (kupić), a bring → brought (przynieść) – łatwo je pomylić.
  - id: a2-01-told
    kind: word
    en: told
    pl: powiedziałem
    plAlt: [ powiedziałam, powiedział, powiedziała, opowiedziałem, opowiedziałam ]
    example:
      en: He told me the truth.
      pl: Powiedział mi prawdę.
    note: tell → told. We tell somebody something, but say something (to somebody).
    notePl: "*Tell* łączy się z osobą (*told me*), *say* – nie (*said to me*, nie *said me*)."
  - id: a2-01-met
    kind: word
    en: met
    pl: poznałem
    plAlt: [ spotkałem, poznałam, spotkałam, poznał, spotkał ]
    example:
      en: I met my wife at university.
      pl: Poznałem żonę na studiach.
    note: meet → met → met. It means both "spotkać" and "poznać".
  - id: a2-01-stayed
    kind: word
    en: stayed
    pl: zostałem
    plAlt: [ zostałam, został, została, zatrzymałem się, zatrzymałam się ]
    example:
      en: We stayed at a small hotel.
      pl: Zatrzymaliśmy się w małym hotelu.
    note: "Regular verb: stay → stayed."
  - id: a2-01-last-weekend
    kind: phrase
    en: last weekend
    pl: w zeszły weekend
    plAlt: [ w ostatni weekend, w poprzedni weekend ]
    example:
      en: What did you do last weekend?
      pl: Co robiłeś w zeszły weekend?
    note: 'No preposition before last: last weekend, not "in last weekend".'
    notePl: "Przed *last* nie ma przyimka: *last week*, nie *in last week*."
  - id: a2-01-two-days-ago
    kind: phrase
    en: two days ago
    pl: dwa dni temu
    example:
      en: I called her two days ago.
      pl: Dzwoniłem do niej dwa dni temu.
    note: "*Ago* comes after the time: two days ago."
    notePl: "*Ago* (temu) stoi po określeniu czasu, tak jak w polskim: *two days ago*."
  - id: a2-01-didnt-know
    kind: phrase
    en: I didn't know
    enAlt: [ I did not know ]
    pl: nie wiedziałem
    plAlt: [ nie wiedziałam ]
    example:
      en: Sorry, I didn't know that.
      pl: Przepraszam, nie wiedziałem o tym.
    note: "After didn't use the base form: didn't know, not didn't knew."
    notePl: "Po *didn't* zawsze forma podstawowa: *didn't know*, nie *didn't knew*."
  - id: a2-01-where-did-you-go
    kind: sentence
    en: Where did you go yesterday?
    pl: Gdzie wczoraj poszedłeś?
    plAlt: [ Gdzie poszedłeś wczoraj?, Dokąd wczoraj poszedłeś?, Gdzie wczoraj pojechałeś?, Gdzie wczoraj poszłaś?, Gdzie wczoraj pojechałaś?, Dokąd wczoraj poszłaś? ]
  - id: a2-01-didnt-see-film
    kind: sentence
    en: I didn't see the film.
    enAlt: [ I did not see the film., I didn't see the movie., I did not see the movie. ]
    pl: Nie widziałem tego filmu.
    plAlt: [ Nie widziałam tego filmu., Nie oglądałem tego filmu., Nie oglądałam tego filmu. ]
  - id: a2-01-visited-grandparents
    kind: sentence
    en: We visited my grandparents last Sunday.
    pl: W zeszłą niedzielę odwiedziliśmy moich dziadków.
    plAlt: [ Odwiedziliśmy moich dziadków w zeszłą niedzielę., W ostatnią niedzielę odwiedziliśmy moich dziadków., W zeszłą niedzielę odwiedziliśmy dziadków. ]
  - id: a2-01-it-was-cold
    kind: sentence
    en: It was very cold yesterday.
    pl: Wczoraj było bardzo zimno.
    plAlt: [ Było wczoraj bardzo zimno. ]
    note: "Past of be: I/he/she/it was, you/we/they were."
    notePl: "Przeszła forma *be*: *was* (I, he, she, it) i *were* (you, we, they)."
