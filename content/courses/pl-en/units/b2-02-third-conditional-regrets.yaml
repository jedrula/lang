id: b2-02-third-conditional-regrets
level: B2
title: Third conditional and regrets
titlePl: Trzeci tryb warunkowy i żal
intro: "The **third conditional** imagines a different past: *If + past perfect, would have + past participle* (*If I had known, I would have helped*). Polish uses the same \"gdybym... to bym...\" form for present and past, so English needs extra care with tenses. For regrets use **I wish / If only**: about the present → past simple (*I wish I had more time*); about the past → past perfect (*I wish I hadn't said that*). For annoying habits: *I wish you would stop...*. Also: *should have* + past participle = criticism of the past (*You should have told me*)."
introPl: "**Trzeci tryb warunkowy** opisuje inną przeszłość: *If + Past Perfect, would have + III forma* (*If I had known, I would have helped* – Gdybym wiedział, pomógłbym). Po polsku \"gdybym... to bym...\" brzmi tak samo dla teraźniejszości i przeszłości, więc po angielsku trzeba uważać na czasy. Żal wyrażamy przez **I wish / If only**: o teraźniejszości → Past Simple (*I wish I had more time* – Szkoda, że nie mam więcej czasu); o przeszłości → Past Perfect (*I wish I hadn't said that* – Żałuję, że to powiedziałem). *Should have* + III forma to wyrzut dotyczący przeszłości (*You should have told me* – Powinieneś był mi powiedzieć)."
items:
  - id: b2-02-i-wish
    kind: phrase
    en: I wish
    pl: szkoda, że
    plAlt: [ "żałuję, że", "chciałbym, żeby", "chciałabym, żeby" ]
    example:
      en: I wish I spoke French.
      pl: Szkoda, że nie mówię po francusku.
    note: Polish often uses a negative ("szkoda, że nie..."), English uses a positive past form.
    notePl: 'Po polsku często mówimy z przeczeniem ("szkoda, że nie mówię"), a po angielsku twierdząco w czasie przeszłym: I wish I spoke.'
  - id: b2-02-if-only
    kind: phrase
    en: if only
    pl: gdyby tylko
    plAlt: [ żeby tylko, oby ]
    example:
      en: If only I had listened to you!
      pl: Gdybym tylko cię posłuchał!
  - id: b2-02-should-have
    kind: phrase
    en: should have
    enAlt: [ should've ]
    pl: powinienem był
    plAlt: [ powinnam była, powinieneś był, należało ]
    example:
      en: You should have told me earlier.
      pl: Powinieneś był mi powiedzieć wcześniej.
    note: Pronounced "should've" – never write "should of".
    notePl: Wymawiamy "should've" – nigdy nie piszemy "should of".
  - id: b2-02-make-a-mistake
    kind: phrase
    en: make a mistake
    pl: popełnić błąd
    plAlt: [ zrobić błąd, pomylić się ]
    example:
      en: Don't worry, everyone can make a mistake.
      pl: Nie martw się, każdy może popełnić błąd.
    note: MAKE a mistake, not "do a mistake".
    notePl: MAKE a mistake, a nie "do a mistake".
  - id: b2-02-regret
    kind: word
    en: regret
    pl: żałować
    plAlt: [ żal, żałuję ]
    example:
      en: I regret selling my old car.
      pl: Żałuję, że sprzedałem stary samochód.
    note: '"Regret" + -ing for the past.'
    notePl: '"Regret" + forma -ing, gdy żałujemy czegoś, co już zrobiliśmy.'
  - id: b2-02-might-have
    kind: phrase
    en: might have
    enAlt: [ might've, could have ]
    pl: może (coś się stało)
    plAlt: [ "możliwe, że", mógł, może ]
    example:
      en: He might have missed the bus.
      pl: Może spóźnił się na autobus.
    note: "Speculation about the past: might/may/could have + past participle."
    notePl: "Spekulacja o przeszłości: might/may/could have + III forma (Może się spóźnił)."
  - id: b2-02-in-hindsight
    kind: phrase
    en: in hindsight
    enAlt: [ with hindsight, looking back ]
    pl: z perspektywy czasu
    plAlt: [ patrząc wstecz, po fakcie ]
    example:
      en: In hindsight, it was a mistake.
      pl: Z perspektywy czasu to był błąd.
  - id: b2-02-s-known
    kind: sentence
    en: If I had known, I would have helped you.
    enAlt: [ "If I'd known, I would have helped you.", "If I'd known, I'd have helped you.", "If I had known, I'd have helped you.", I would have helped you if I had known., I would have helped you if I'd known. ]
    pl: Gdybym wiedział, pomógłbym ci.
    plAlt: [ "Gdybym wiedziała, pomogłabym ci.", "Gdybym wiedział, to bym ci pomógł.", "Gdybym wiedziała, to bym ci pomogła." ]
    note: Not "If I would have known".
    notePl: Nie "If I would have known" – w części z "if" nie ma "would".
  - id: b2-02-s-hadnt-said
    kind: sentence
    en: I wish I hadn't said that.
    enAlt: [ I wish I had not said that., If only I hadn't said that. ]
    pl: Żałuję, że to powiedziałem.
    plAlt: [ "Żałuję, że to powiedziałam.", "Szkoda, że to powiedziałem.", "Szkoda, że to powiedziałam." ]
  - id: b2-02-s-more-time
    kind: sentence
    en: I wish I had more time.
    enAlt: [ If only I had more time. ]
    pl: Szkoda, że nie mam więcej czasu.
    plAlt: [ Chciałbym mieć więcej czasu., Chciałabym mieć więcej czasu., "Żałuję, że nie mam więcej czasu." ]
  - id: b2-02-s-would-stop
    kind: sentence
    en: I wish you would stop interrupting me.
    enAlt: [ I wish you'd stop interrupting me. ]
    pl: Chciałbym, żebyś przestał mi przerywać.
    plAlt: [ "Chciałabym, żebyś przestał mi przerywać.", Mógłbyś wreszcie przestać mi przerywać., "Chciałbym, żebyś przestała mi przerywać.", "Chciałabym, żebyś przestała mi przerywać." ]
    note: "\"I wish you would...\" = irritation about someone's behaviour."
    notePl: '"I wish you would..." wyraża irytację czyimś zachowaniem.'
  - id: b2-02-s-missed-train
    kind: sentence
    en: If we had left earlier, we wouldn't have missed the train.
    enAlt: [ "If we'd left earlier, we wouldn't have missed the train.", "If we had left earlier, we would not have missed the train.", We wouldn't have missed the train if we had left earlier. ]
    pl: Gdybyśmy wyszli wcześniej, nie spóźnilibyśmy się na pociąg.
    plAlt: [ "Gdybyśmy wyjechali wcześniej, nie spóźnilibyśmy się na pociąg.", "Gdybyśmy wcześniej wyszli, nie spóźnilibyśmy się na pociąg." ]
