id: b1-01-present-perfect
level: B1
title: "Present Perfect: ever, never, already, yet, just"
titlePl: "Present Perfect: ever, never, already, yet, just"
intro: "The **Present Perfect** (have/has + past participle) links the past with **now**: life experience (*Have you ever been to Spain?*), recent news (*I've just eaten*) or unfinished time (*I've lived here for five years*). Polish has no such tense, so Poles often use Past Simple or Present Simple instead. Rule of thumb: if you say **when** it happened (*yesterday, in 2019, last week*), use **Past Simple**. With **for/since** and an action still going on, English uses Present Perfect where Polish uses the present tense."
introPl: "**Present Perfect** (have/has + III forma czasownika) łączy przeszłość z **teraźniejszością**: doświadczenie życiowe (*Have you ever been to Spain?* – Byłeś kiedyś w Hiszpanii?), świeże wydarzenia (*I've just eaten* – Właśnie zjadłem) albo okres, który trwa (*I've lived here for five years* – Mieszkam tu od pięciu lat). W polskim nie ma takiego czasu, dlatego często mylimy go z Past Simple. Zasada: jeśli podajesz **kiedy** (*yesterday, in 2019, last week*), użyj **Past Simple**. Gdy coś trwa do teraz (**for/since**), po polsku mówimy w czasie teraźniejszym, a po angielsku – Present Perfect."
items:
  - id: b1-01-ever
    kind: word
    en: ever
    pl: kiedykolwiek
    plAlt: [ kiedyś ]
    example:
      en: Have you ever tried sushi?
      pl: Próbowałeś kiedyś sushi?
    note: '"Ever" is used mostly in questions: Have you ever...?'
    notePl: '"Ever" występuje głównie w pytaniach: Have you ever...? (Czy kiedykolwiek...?)'
  - id: b1-01-never
    kind: word
    en: never
    pl: nigdy
    example:
      en: I've never been to London.
      pl: Nigdy nie byłem w Londynie.
    note: "No double negative: \"I have never been\", not \"I haven't never been\"."
    notePl: "Bez podwójnego przeczenia: \"I have never been\", a nie \"I haven't never been\"."
  - id: b1-01-already
    kind: word
    en: already
    pl: już
    example:
      en: We've already finished the project.
      pl: Już skończyliśmy projekt.
    note: '"Already" usually goes between have and the participle.'
    notePl: '"Already" stawiamy zwykle między have a III formą: I have already done it.'
  - id: b1-01-yet
    kind: word
    en: yet
    pl: jeszcze
    plAlt: [ już ]
    example:
      en: She hasn't called yet.
      pl: Jeszcze nie zadzwoniła.
    note: '"Yet" goes at the end of negatives (= jeszcze nie) and questions (= już?).'
    notePl: '"Yet" stoi na końcu zdania: w przeczeniach znaczy "jeszcze nie", w pytaniach "już?" (Have you finished yet? – Skończyłeś już?).'
  - id: b1-01-just
    kind: word
    en: just
    pl: właśnie
    plAlt: [ dopiero co, przed chwilą ]
    example:
      en: I've just seen your message.
      pl: Właśnie zobaczyłem twoją wiadomość.
  - id: b1-01-been-to
    kind: phrase
    en: have been to
    pl: być w (jakimś miejscu)
    plAlt: [ byłem w, byłam w ]
    example:
      en: I have been to Paris twice.
      pl: Byłem w Paryżu dwa razy.
    note: '"Been to" = went and came back. "Gone to" = went and is still there.'
    notePl: '"He has been to Rome" – był w Rzymie (i wrócił). "He has gone to Rome" – pojechał do Rzymu (i nadal tam jest).'
  - id: b1-01-for-ages
    kind: phrase
    en: for ages
    pl: od wieków
    plAlt: [ od dawna, kopę lat ]
    example:
      en: I haven't seen him for ages.
      pl: Nie widziałem go od wieków.
  - id: b1-01-so-far
    kind: phrase
    en: so far
    pl: do tej pory
    plAlt: [ jak dotąd, na razie ]
    example:
      en: So far we've sold 200 tickets.
      pl: Do tej pory sprzedaliśmy 200 biletów.
  - id: b1-01-since-2020
    kind: phrase
    en: since 2020
    pl: od 2020 roku
    plAlt: [ od 2020 ]
    example:
      en: She has worked here since 2020.
      pl: Ona pracuje tu od 2020 roku.
    note: '"Since" + a point in time; "for" + a period (for three years).'
    notePl: '"Since" + punkt w czasie (since Monday), "for" + okres (for three days). Po polsku w obu przypadkach "od".'
  - id: b1-01-s-lived
    kind: sentence
    en: I've lived here for ten years.
    enAlt: [ I have lived here for ten years., I've been living here for ten years., I have been living here for ten years. ]
    pl: Mieszkam tu od dziesięciu lat.
    plAlt: [ Mieszkam tutaj od dziesięciu lat., Mieszkam tu od 10 lat. ]
    note: Not "I live here for ten years" – the action continues up to now, so use Present Perfect.
    notePl: Nie "I live here for ten years" – czynność trwa do teraz, więc Present Perfect.
  - id: b1-01-s-ever-been
    kind: sentence
    en: Have you ever been to Italy?
    pl: Byłeś kiedyś we Włoszech?
    plAlt: [ Byłaś kiedyś we Włoszech?, Czy byłeś kiedyś we Włoszech?, Czy byłaś kiedyś we Włoszech?, Byliście kiedyś we Włoszech? ]
  - id: b1-01-s-yesterday
    kind: sentence
    en: I saw that film yesterday.
    enAlt: [ I saw that movie yesterday., I saw this film yesterday., I saw the film yesterday. ]
    pl: Widziałem ten film wczoraj.
    plAlt: [ Widziałam ten film wczoraj., Wczoraj widziałem ten film., Wczoraj widziałam ten film., Oglądałem ten film wczoraj., Oglądałam ten film wczoraj. ]
    note: '"Yesterday" is a finished time, so Past Simple – not "I have seen it yesterday".'
    notePl: '"Yesterday" to zakończony czas, więc Past Simple – nie "I have seen it yesterday".'
  - id: b1-01-s-lost-keys
    kind: sentence
    en: I've lost my keys.
    enAlt: [ I have lost my keys. ]
    pl: Zgubiłem klucze.
    plAlt: [ Zgubiłam klucze., Zgubiłem moje klucze., Zgubiłam moje klucze. ]
    note: "Present Perfect: the result matters now (I don't have them)."
    notePl: Present Perfect, bo liczy się skutek teraz – nie mam kluczy.
  - id: b1-01-s-not-finished-yet
    kind: sentence
    en: Have you finished yet?
    pl: Skończyłeś już?
    plAlt: [ Skończyłaś już?, Już skończyłeś?, Już skończyłaś?, Czy już skończyłeś?, Czy już skończyłaś? ]
