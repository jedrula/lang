id: a1-03-numbers-time
level: A1
title: Numbers, time & days
titlePl: Liczby, godziny i dni
intro: "Count, tell the time and name the days. Use **at** with times (at seven o'clock) and **on** with days (on Monday). Days of the week always start with a capital letter. For age use **to be**: I am twenty."
introPl: "Liczymy, podajemy godzinę i dni tygodnia. Z godzinami używamy **at** (at seven o'clock – o siódmej), z dniami **on** (on Monday – w poniedziałek). Dni tygodnia piszemy wielką literą. Wiek podajemy z czasownikiem **to be**: I am twenty (nie: I have twenty years)."
items:
  - id: a1-time-three
    kind: word
    en: three
    pl: trzy
    example:
      en: I have three sisters.
      pl: Mam trzy siostry.
    note: Three starts with "th" (tongue between teeth), not "t" or "f".
    notePl: Three zaczyna się od „th” (język między zębami) – nie „tri” ani „fri”.
  - id: a1-time-fifteen
    kind: word
    en: fifteen
    pl: piętnaście
    example:
      en: The bus is in fifteen minutes.
      pl: Autobus jest za piętnaście minut.
    note: "Stress: fif-TEEN (15) but FIF-ty (50)."
    notePl: "Uważaj na akcent: fif-TEEN (15), ale FIF-ty (50). Tak samo thirteen/thirty itd."
  - id: a1-time-twenty
    kind: word
    en: twenty
    pl: dwadzieścia
    example:
      en: She is twenty years old.
      pl: Ona ma dwadzieścia lat.
  - id: a1-time-hundred
    kind: word
    en: hundred
    enAlt: [ a hundred, one hundred ]
    pl: sto
    example:
      en: It costs one hundred zlotys.
      pl: To kosztuje sto złotych.
    note: "No -s after a number: two hundred (not: two hundreds)."
    notePl: "Po liczbie nie ma -s: two hundred (nie: two hundreds)."
  - id: a1-time-what-time-is-it
    kind: phrase
    en: what time is it
    enAlt: [ what's the time, what is the time ]
    pl: która jest godzina
    plAlt: [ która godzina ]
    example:
      en: Excuse me, what time is it?
      pl: Przepraszam, która jest godzina?
  - id: a1-time-at-seven
    kind: phrase
    en: at seven o'clock
    enAlt: [ at seven, at 7, at 7 o'clock ]
    pl: o siódmej
    plAlt: [ o godzinie siódmej, o siódmej godzinie, o 7 ]
    example:
      en: I get up at seven o'clock.
      pl: Wstaję o siódmej.
    note: O'clock is only for full hours.
    notePl: "O'clock dodajemy tylko przy pełnych godzinach: at seven o'clock, ale at seven fifteen."
  - id: a1-time-half-past-two
    kind: phrase
    en: half past two
    enAlt: [ two thirty ]
    pl: wpół do trzeciej
    plAlt: [ druga trzydzieści, czternasta trzydzieści, w pół do trzeciej ]
    example:
      en: It's half past two.
      pl: Jest wpół do trzeciej.
    note: Half past two = 2:30. English counts from the past hour.
    notePl: Pułapka! Half past two to 2:30, czyli „wpół do trzeciej” – angielski liczy od minionej godziny (pół po drugiej).
  - id: a1-time-monday
    kind: word
    en: Monday
    pl: poniedziałek
    example:
      en: I work on Monday.
      pl: Pracuję w poniedziałek.
    note: "Days take on: on Monday, on Friday."
    notePl: "Z dniami tygodnia używamy on: on Monday (w poniedziałek)."
  - id: a1-time-friday
    kind: word
    en: Friday
    pl: piątek
    example:
      en: See you on Friday.
      pl: Do zobaczenia w piątek.
  - id: a1-time-today
    kind: word
    en: today
    pl: dzisiaj
    plAlt: [ dziś ]
    example:
      en: Today is Monday.
      pl: Dzisiaj jest poniedziałek.
  - id: a1-time-tomorrow
    kind: word
    en: tomorrow
    pl: jutro
    example:
      en: See you tomorrow.
      pl: Do zobaczenia jutro.
  - id: a1-time-s-three-oclock
    kind: sentence
    en: It's three o'clock.
    enAlt: [ It is three o'clock, It's three, It is three ]
    pl: Jest trzecia.
    plAlt: [ jest godzina trzecia, jest trzecia godzina, jest piętnasta, jest godzina piętnasta ]
    note: "English needs a subject: It's three o'clock (not: Is three o'clock)."
    notePl: "Po angielsku musi być podmiot: It's three o'clock (nie: Is three o'clock)."
  - id: a1-time-s-today-is-friday
    kind: sentence
    en: Today is Friday.
    enAlt: [ It's Friday today, It is Friday today ]
    pl: Dzisiaj jest piątek.
    plAlt: [ dziś jest piątek, dzisiaj piątek, dziś piątek ]
  - id: a1-time-s-i-am-twenty
    kind: sentence
    en: I am twenty years old.
    enAlt: [ I'm twenty years old, I'm twenty, I am twenty ]
    pl: Mam dwadzieścia lat.
    note: Age uses be, not have.
    notePl: "Wiek podajemy z be, nie z have: I am twenty (nie: I have twenty years)."
