# Unit file — see CONTRIBUTING.md. Never change an item's id (progress is stored by it).
id: a2-02-shopping-money
level: A2
title: Shopping and money
titlePl: Zakupy i pieniądze
intro: "Ask about prices with **How much is / are…?** To compare things, short adjectives add **-er** (cheap → cheaper) and long ones use **more** (more expensive). After a comparative use **than**: *It's cheaper than the other one.*"
introPl: "O cenę pytamy **How much is…?** (jedna rzecz) albo **How much are…?** (kilka rzeczy). Stopień wyższy: krótkie przymiotniki dostają **-er** (cheap → cheaper, big → bigger), a dłuższe poprzedzamy słowem **more** (*more expensive*, nie *expensiver*). „Niż” to **than** – nie myl z *then* (potem). Uwaga na formy nieregularne: good → better, bad → worse."
items:
  - id: a2-02-how-much-is-it
    kind: phrase
    en: How much is it?
    enAlt: [ How much does it cost? ]
    pl: Ile to kosztuje?
    plAlt: [ Ile kosztuje?, Ile płacę? ]
    example:
      en: Excuse me, how much is it?
      pl: Przepraszam, ile to kosztuje?
    note: "Use are for plural: How much are these shoes?"
    notePl: "Dla liczby mnogiej: *How much are these shoes?*"
  - id: a2-02-price
    kind: word
    en: price
    pl: cena
    example:
      en: The price is too high.
      pl: Cena jest za wysoka.
  - id: a2-02-cheap
    kind: word
    en: cheap
    pl: tani
    plAlt: [ tania, tanie ]
    example:
      en: This shirt is really cheap.
      pl: Ta koszula jest naprawdę tania.
  - id: a2-02-expensive
    kind: word
    en: expensive
    pl: drogi
    plAlt: [ droga, drogie, kosztowny ]
    example:
      en: London is very expensive.
      pl: Londyn jest bardzo drogi.
  - id: a2-02-cheaper
    kind: word
    en: cheaper
    pl: tańszy
    plAlt: [ tańsza, tańsze ]
    example:
      en: This one is cheaper than that one.
      pl: Ten jest tańszy niż tamten.
    note: Short adjectives add -er. "Niż" = than (not then).
    notePl: "Krótkie przymiotniki: -er (cheap → cheaper). „Niż” to *than*, a nie *then*."
  - id: a2-02-more-expensive
    kind: phrase
    en: more expensive
    pl: droższy
    plAlt: [ droższa, droższe ]
    example:
      en: The red dress is more expensive.
      pl: Czerwona sukienka jest droższa.
    note: 'Long adjectives use more: more expensive, not "expensiver".'
    notePl: "Długie przymiotniki tworzą stopień wyższy z *more*: *more expensive*, nie *expensiver*."
  - id: a2-02-better
    kind: word
    en: better
    pl: lepszy
    plAlt: [ lepsza, lepsze, lepiej ]
    example:
      en: This phone is better than my old one.
      pl: Ten telefon jest lepszy niż mój stary.
    note: "Irregular: good → better → best."
    notePl: "Nieregularne: good → better → best (nie *gooder*)."
  - id: a2-02-change
    kind: word
    en: change
    pl: reszta
    plAlt: [ drobne ]
    example:
      en: Here is your change.
      pl: Proszę, oto reszta.
    note: Change = money you get back, or coins. It also means "zmiana".
    notePl: "*Change* to reszta lub drobne, ale też „zmiana”."
  - id: a2-02-receipt
    kind: word
    en: receipt
    pl: paragon
    plAlt: [ potwierdzenie zakupu ]
    example:
      en: Can I have the receipt, please?
      pl: Czy mogę prosić o paragon?
    note: "The p is silent: /rɪˈsiːt/. In a restaurant you ask for the bill."
    notePl: "„p” jest nieme: /rɪˈsiːt/. Rachunek w restauracji to *the bill*."
  - id: a2-02-pay-by-card
    kind: phrase
    en: pay by card
    pl: zapłacić kartą
    plAlt: [ płacić kartą ]
    example:
      en: Can I pay by card?
      pl: Czy mogę zapłacić kartą?
    note: pay by card, but pay in cash.
    notePl: "*pay by card* (kartą), ale *pay in cash* (gotówką)."
  - id: a2-02-just-looking
    kind: phrase
    en: I'm just looking
    enAlt: [ I am just looking ]
    pl: tylko się rozglądam
    plAlt: [ tylko oglądam, ja się tylko rozglądam ]
    example:
      en: No, thanks, I'm just looking.
      pl: Nie, dziękuję, tylko się rozglądam.
  - id: a2-02-smaller-size
    kind: sentence
    en: Do you have this in a smaller size?
    enAlt: [ Have you got this in a smaller size? ]
    pl: Czy macie to w mniejszym rozmiarze?
    plAlt: [ Macie to w mniejszym rozmiarze?, Czy jest to w mniejszym rozmiarze?, Czy ma pan to w mniejszym rozmiarze?, Czy ma pani to w mniejszym rozmiarze? ]
  - id: a2-02-bus-cheaper
    kind: sentence
    en: The bus is cheaper than the taxi.
    pl: Autobus jest tańszy niż taksówka.
    plAlt: [ Autobus jest tańszy od taksówki. ]
  - id: a2-02-try-on
    kind: sentence
    en: Can I try this on?
    enAlt: [ Can I try it on?, Could I try this on?, Could I try it on? ]
    pl: Czy mogę to przymierzyć?
    plAlt: [ Mogę to przymierzyć? ]
    note: try on = przymierzyć (clothes).
    notePl: "*try on* = przymierzyć; zaimek stoi w środku: *try it on*."
