# Unit file — see CONTRIBUTING.md. Never change an item's id (progress is stored by it).
id: a1-05-daily-routine
level: A1
title: Everyday actions (Present Simple)
titlePl: Codzienne czynności (Present Simple)
intro: Use the **Present Simple** for habits and facts. After he/she/it add **-s** to the verb (she works, he goes, she watches). Make questions with **do** (I/you/we/they) or **does** (he/she/it), and negatives with **don't / doesn't** – after does and doesn't the verb has no -s.
introPl: "**Present Simple** opisuje czynności powtarzalne, zwyczaje i fakty (codziennie, zwykle, zawsze). Po **he/she/it** dodajemy do czasownika **-s**: I work → she work**s**, go → go**es**, watch → watch**es**. To bardzo częsty błąd – pamiętaj o -s! Pytania tworzymy z **do** (I/you/we/they) lub **does** (he/she/it): Do you work? Does she work? Po does czasownik wraca do formy podstawowej (bez -s): Does she work? (nie: Does she works?). Przeczenia: **don't / doesn't** + czasownik: I don't eat meat, He doesn't drink coffee."
items:
  - id: a1-daily-work
    kind: word
    en: work
    pl: pracować
    example:
      en: I work in an office.
      pl: Pracuję w biurze.
  - id: a1-daily-live
    kind: word
    en: live
    pl: mieszkać
    plAlt: [ żyć ]
    example:
      en: They live in London.
      pl: Oni mieszkają w Londynie.
  - id: a1-daily-get-up
    kind: phrase
    en: get up
    pl: wstawać
    plAlt: [ wstać ]
    example:
      en: I get up at seven.
      pl: Wstaję o siódmej.
  - id: a1-daily-go
    kind: word
    en: go
    pl: iść
    plAlt: [ chodzić, jechać, jeździć, pójść, pojechać ]
    example:
      en: We go to school by bus.
      pl: Jeździmy do szkoły autobusem.
    note: "Go covers both walking and travelling. He/she form: goes."
    notePl: "Go to i „iść”, i „jechać” – angielski nie rozróżnia. Forma dla he/she: goes."
  - id: a1-daily-eat
    kind: word
    en: eat
    pl: jeść
    example:
      en: We eat dinner at six.
      pl: Jemy obiad o szóstej.
  - id: a1-daily-drink
    kind: word
    en: drink
    pl: pić
    example:
      en: He doesn't drink coffee.
      pl: On nie pije kawy.
  - id: a1-daily-speak
    kind: word
    en: speak
    pl: mówić
    plAlt: [ rozmawiać ]
    example:
      en: Do you speak English?
      pl: Czy mówisz po angielsku?
    note: speak English = mówić po angielsku (no "in").
    notePl: „Mówić po angielsku” to speak English – bez dodatkowego przyimka.
  - id: a1-daily-watch-tv
    kind: phrase
    en: watch TV
    enAlt: [ watch television ]
    pl: oglądać telewizję
    plAlt: [ oglądać tv, oglądać telewizor ]
    example:
      en: We watch TV in the evening.
      pl: Wieczorem oglądamy telewizję.
    note: "He/she form: watches (add -es after ch, sh, s, x, o)."
    notePl: "Dla he/she: watches – po -ch, -sh, -s, -x, -o dodajemy -es."
  - id: a1-daily-every-day
    kind: phrase
    en: every day
    pl: codziennie
    plAlt: [ każdego dnia, co dzień ]
    example:
      en: I read every day.
      pl: Czytam codziennie.
    note: every day (two words) = codziennie; everyday (one word) = codzienny.
    notePl: every day (osobno) = codziennie; everyday (razem) = codzienny, np. everyday life.
  - id: a1-daily-usually
    kind: word
    en: usually
    pl: zwykle
    plAlt: [ zazwyczaj, przeważnie ]
    example:
      en: He usually gets up at six.
      pl: On zwykle wstaje o szóstej.
    note: "Put it before the main verb: He usually gets up..."
    notePl: "Stawiamy je przed czasownikiem głównym (ale po am/is/are): He usually gets up, She is usually late."
  - id: a1-daily-s-she-works-in-a-shop
    kind: sentence
    en: She works in a shop.
    pl: Ona pracuje w sklepie.
    plAlt: [ pracuje w sklepie ]
    note: she works – don't forget the -s!
    notePl: she works – nie zapomnij o -s po she!
  - id: a1-daily-s-does-he-speak-english
    kind: sentence
    en: Does he speak English?
    pl: Czy on mówi po angielsku?
    plAlt: [ on mówi po angielsku, czy mówi po angielsku, mówi po angielsku ]
    note: "After does, no -s on the verb: Does he speak (not: speaks)."
    notePl: "Po does czasownik bez -s: Does he speak? (nie: Does he speaks?). Polskie „czy” to tutaj does."
  - id: a1-daily-s-i-dont-eat-meat
    kind: sentence
    en: I don't eat meat.
    enAlt: [ I do not eat meat ]
    pl: Nie jem mięsa.
  - id: a1-daily-s-where-do-you-live
    kind: sentence
    en: Where do you live?
    pl: Gdzie mieszkasz?
    plAlt: [ gdzie pan mieszka, gdzie pani mieszka, gdzie mieszkacie ]
    note: Question word + do/does + subject + verb.
    notePl: "Kolejność: słowo pytające + do/does + podmiot + czasownik. Nie: Where you live?"
